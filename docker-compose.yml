version: '3.4'

volumes:
  l2_data:

services:
  l2:
    platform: linux/amd64
    image: offchainlabs/nitro-node:v3.8.0-62c0aa7
    ports:
      - "8545:8545"
      - "8546:8546"
    volumes:
      - "${PWD}/nodeConfig.json:/config/nodeConfig.json"
      - "${PWD}/l2_data:/home/user/.arbitrum"
    entrypoint:
      - "/usr/local/bin/nitro"
      - --conf.file=/config/nodeConfig.json
      - --execution.forwarding-target=wss://tranched-testnet.rpc.caldera.xyz/ws
      - --node.feed.input.url=wss://tranched-testnet.rpc.caldera.xyz/feed
      - --node.data-availability.rest-aggregator.urls="https://tranched-testnet.rpc.caldera.xyz/rest-aggregator"
      - --parent-chain.connection.url=https://base-sepolia.g.alchemy.com/v2/${API_KEY_ALCHEMY}
      - --node.dangerous.disable-blob-reader
